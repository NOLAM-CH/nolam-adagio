# ─────────────────────────────────────────────────────────────
# Profil : MALVOYANT (basse vision)
# Objectif : maximum de taille et de contraste, loupe à disposition.
#            Pour qui voit encore, mais difficilement.
# Note     : le thème HighContrast nécessite le paquet
#            « gnome-themes-extra » (sinon le moteur ignore la ligne).
# ─────────────────────────────────────────────────────────────

[org.cinnamon.desktop.interface]
# Texte très agrandi (~80 %)
text-scaling-factor = 1.8
# Curseur énorme
cursor-size = 64
# Police large
font-name = Sans 16
# Thème à fort contraste
gtk-theme = HighContrast
icon-theme = HighContrast

[org.gnome.desktop.interface]
text-scaling-factor = 1.8
cursor-size = 64
font-name = Sans 16
gtk-theme = HighContrast

[org.cinnamon.desktop.wm.preferences]
titlebar-font = Sans Bold 16

[org.nemo.preferences]
click-policy = single

[org.gnome.desktop.a11y.applications]
# Loupe d'écran activée (Méta + molette pour zoomer)
screen-magnifier-enabled = true

[org.gnome.desktop.a11y.magnifier]
# Grossissement x2 au démarrage de la loupe
mag-factor = 2.0
