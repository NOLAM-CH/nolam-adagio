# ─────────────────────────────────────────────────────────────
# Profil : SENIOR  (v2 — calibré sur Mint 22.3 Cinnamon, 2 juin 2026)
# Objectif : interface plus grande, plus claire, plus calme, plus simple.
#            Pas de bouleversement — on adoucit ce qui existe.
# Format   : [schema gsettings]  puis  clé = valeur (sans guillemets)
# ─────────────────────────────────────────────────────────────

[org.cinnamon.desktop.interface]
# Tout le texte ~40 % plus grand
text-scaling-factor = 1.4
# Curseur bien visible
cursor-size = 36
# Police lisible
font-name = Sans 13
# Thème CLAIR cohérent (le défaut Mint 22.3 a un panneau sombre, peu lisible)
gtk-theme = Mint-Y
icon-theme = Mint-Y

[org.cinnamon.theme]
# Thème du panneau / menu (la clé qui enlève le sombre)
name = Mint-Y

[org.gnome.desktop.interface]
# Miroir pour les applis GTK qui lisent le schéma GNOME
text-scaling-factor = 1.4
cursor-size = 36
font-name = Sans 13

[org.cinnamon.desktop.wm.preferences]
# Titres de fenêtres plus gros et gras, thème clair
titlebar-font = Sans Bold 12
theme = Mint-Y

[org.nemo.preferences]
# Un seul clic pour ouvrir (plus de double-clic à rater)
click-policy = single
# Ouvrir en vue ICÔNES par défaut (plus visuel qu'une liste pour un senior)
default-folder-viewer = icon-view

[org.nemo.icon-view]
# Icônes des dossiers plus grandes + espacement aéré (lisibilité)
default-zoom-level = larger
default-use-tighter-layout = false
thumbnail-size = 64

[org.nemo.list-view]
# Si l'utilisateur passe en vue liste : taille lisible (pas la minuscule par défaut)
default-zoom-level = standard

[org.nemo.window-state]
# Grande fenêtre Fichiers + barre latérale large (taille réglée à la souris)
geometry = 1337x844+291+51
sidebar-width = 347

[org.cinnamon]
# Panneau (barre des tâches) plus haut, icônes système plus grosses
panels-height = ['1:48']
panel-zone-icon-sizes = [{"panelId": 1, "left": 0, "center": 0, "right": 32}]

[org.cinnamon.desktop.screensaver]
# JAMAIS de verrouillage d'écran : un senior ne doit pas se retrouver
# enfermé dehors de sa propre machine.
lock-enabled = false
idle-activation-enabled = false

[org.cinnamon.desktop.session]
# Écran ne se met jamais en veille tout seul (0 = jamais)
idle-delay = 0

[org.cinnamon.settings-daemon.plugins.power]
# Pas de verrouillage à la sortie de veille
lock-on-suspend = false
