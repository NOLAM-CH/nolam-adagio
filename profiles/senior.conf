# ─────────────────────────────────────────────────────────────
# Profil : SENIOR
# Objectif : interface plus grande, plus calme, plus simple.
#            Pas de bouleversement — on adoucit ce qui existe.
# Format   : [schema gsettings]  puis  clé = valeur (sans guillemets)
# ─────────────────────────────────────────────────────────────

[org.cinnamon.desktop.interface]
# Tout le texte ~40 % plus grand
text-scaling-factor = 1.4
# Curseur bien visible
cursor-size = 36
# Police lisible
font-name = Sans 13

[org.gnome.desktop.interface]
# Miroir pour les applis GTK qui lisent le schéma GNOME
text-scaling-factor = 1.4
cursor-size = 36
font-name = Sans 13

[org.cinnamon.desktop.wm.preferences]
# Titres de fenêtres plus gros et gras
titlebar-font = Sans Bold 12

[org.nemo.preferences]
# Un seul clic pour ouvrir (plus de double-clic à rater)
click-policy = single
