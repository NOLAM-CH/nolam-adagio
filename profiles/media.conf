# ─────────────────────────────────────────────────────────────
# Profil : MEDIA  (box TV / salon — « mediaplayer »)
# Objectif : bureau lisible depuis le canapé, thème sombre reposant
#            pour la TV, jamais de veille ni de verrouillage (box H24).
#            Se regarde de LOIN → texte et curseur plus gros que senior.
# Format   : [schema gsettings]  puis  clé = valeur (sans guillemets)
#
# S'applique comme les autres :  ./install.sh media
# Pour la fluidité vidéo sur petit CPU, poser AUSSI le profil léger :
#   ./install.sh media
#   ./install.sh leger      # additif (coupe les effets = décodage plus fluide)
# Réversible : ./restore.sh
# ─────────────────────────────────────────────────────────────

[org.cinnamon.desktop.interface]
# Texte ~50 % plus grand : lisible à distance canapé (> senior qui est à 40 cm)
text-scaling-factor = 1.5
# Curseur bien gros, repérable sur grand écran depuis le fond du salon
cursor-size = 48
# Police lisible de loin
font-name = Sans 14
# Thème SOMBRE : moins fatigant devant la TV le soir, meilleur contraste vidéo
gtk-theme = Mint-Y-Dark
icon-theme = Mint-Y

[org.cinnamon.theme]
# Panneau / menu en sombre (cohérent avec le thème salon)
name = Mint-Y-Dark

[org.gnome.desktop.interface]
# Miroir pour les applis GTK qui lisent le schéma GNOME
text-scaling-factor = 1.5
cursor-size = 48
font-name = Sans 14
gtk-theme = Mint-Y-Dark

[org.cinnamon.desktop.wm.preferences]
# Titres de fenêtres gros + thème sombre assorti
titlebar-font = Sans Bold 13
theme = Mint-Y-Dark

[org.nemo.preferences]
# Un seul clic pour ouvrir (télécommande / souris depuis le canapé)
click-policy = single
# Vue icônes par défaut (parcourir films/photos visuellement)
default-folder-viewer = icon-view

[org.nemo.icon-view]
# Grosses vignettes = films/photos reconnaissables de loin
default-zoom-level = larger
default-use-tighter-layout = false
thumbnail-size = 96

[org.cinnamon]
# Panneau plus haut + icônes système plus grosses (visibles de loin)
panels-height = ['1:48']
panel-zone-icon-sizes = [{"panelId": 1, "left": 0, "center": 0, "right": 32}]

[org.cinnamon.muffin]
# Les fenêtres plein écran court-circuitent le compositeur → vidéo/stream plus fluide
unredirect-fullscreen-windows = true

[org.cinnamon.desktop.screensaver]
# JAMAIS de verrouillage : une box salon ne doit jamais demander un mot de passe
lock-enabled = false
idle-activation-enabled = false

[org.cinnamon.desktop.session]
# L'écran ne se met jamais en veille tout seul (0 = jamais) — on regarde un match
idle-delay = 0

[org.cinnamon.settings-daemon.plugins.power]
# Pas de verrouillage à la sortie de veille, jamais de suspension sur secteur
lock-on-suspend = false
sleep-inactive-ac-type = 'nothing'
sleep-inactive-battery-type = 'nothing'
