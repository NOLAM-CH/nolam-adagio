# ─────────────────────────────────────────────────────────────
# Profil : LÉGER  (performance)
# Objectif : alléger Cinnamon sur les machines à carte graphique
#            modeste (vieux Mac/PC de récup, iGPU faible). Coupe les
#            effets et animations du bureau → interface plus vive, et
#            capture d'écran (RustDesk) bien moins lourde.
#
# S'APPLIQUE PAR-DESSUS un profil d'accessibilité (senior, malvoyant) :
#   ./install.sh senior      # d'abord l'accessibilité
#   ./install.sh leger       # puis l'allègement (additif, ne touche pas le reste)
#
# Réversible comme tout le reste : ./restore.sh
# Les clés absentes d'une version de Cinnamon sont ignorées sans erreur.
# Format : [schema gsettings]  puis  clé = valeur (sans guillemets)
# ─────────────────────────────────────────────────────────────

[org.cinnamon]
# Coupe les effets de fenêtres (ouverture/fermeture/réduction) = le gros gain GPU
desktop-effects = false
# Pas d'animation au démarrage de session
startup-animation = false

[org.cinnamon.desktop.interface]
# Désactive les animations de l'interface Cinnamon
enable-animations = false

[org.gnome.desktop.interface]
# Miroir pour les applications GTK/GNOME
enable-animations = false

[org.cinnamon.muffin]
# Laisse les fenêtres plein écran court-circuiter le compositeur (vidéo/jeux plus fluides)
unredirect-fullscreen-windows = true
